name: CI/CD - Build, Scan, Push to ECR, Deploy to EKS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: java-cicd-app
  EKS_CLUSTER: java-cicd-cluster
  K8S_NAMESPACE: java-cicd

permissions:
  contents: read
  id-token: write

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: Build & test (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests and package application
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      # Each GitHub Actions job gets a fresh runner. Pass the JAR to docker-push.
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

  docker-push:
    name: Build image & push to ECR
    needs: [secret-scan, build-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image name
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          docker build -f src/main/Dockerfile -t "${{ steps.meta.outputs.image }}" .
          docker tag "${{ steps.meta.outputs.image }}" "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"

  deploy:
    name: Deploy to EKS
    needs: docker-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          sed -i "s|IMAGE_PLACEHOLDER|${{ needs.docker-push.outputs.image }}|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for deployment rollout
        run: kubectl rollout status deployment/java-cicd-app -n "$K8S_NAMESPACE" --timeout=300s

      - name: Wait for public LoadBalancer DNS
        run: |
          for i in {1..36}; do
            HOST=$(kubectl get svc java-cicd-app -n "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then
              echo "Application URL: http://$HOST"
              exit 0
            fi
            echo "Waiting for AWS LoadBalancer hostname ($i/36)..."
            sleep 10
          done
          kubectl describe svc java-cicd-app -n "$K8S_NAMESPACE"
          echo "LoadBalancer hostname was not assigned within 6 minutes."
          exit 1
