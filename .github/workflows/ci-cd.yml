name: CI/CD Pipeline

on:
  push:
    branches:
      - master

permissions:
  id-token: write   # CRITICAL: Grants permission to request the OIDC JWT token from GitHub
  contents: read    # Grants permission to read the repository code

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::321659417993:role/GitHubActionsEKSDeployRole
          aws-region: ap-south-2
          audience: sts.amazonaws.com

  build-test:
    name: Build & test (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests and package application
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

  docker-push:
    name: Build image & push to ECR
    needs: [secret-scan, build-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # CRITICAL for OIDC
      contents: read    # CRITICAL for checkout

    outputs:
      image: ${{ steps.meta.outputs.image }}
    

    steps:
      - uses: actions/checkout@v4

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-2

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image name
        id: meta
        run: |
          echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          docker build -f Dockerfile -t "${{ steps.meta.outputs.image }}" .
          docker tag "${{ steps.meta.outputs.image }}" "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"

  deploy:
    name: Deploy to EKS
    needs: docker-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # CRITICAL for OIDC
      contents: read    # CRITICAL for checkout

    steps:
      - uses: actions/checkout@v4
    

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      - name: Apply Kubernetes manifests
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ needs.docker-push.outputs.image }}|" k8s/deployment.yaml

          kubectl apply -n "$K8S_NAMESPACE" -f k8s/deployment.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/service.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/java-cicd-app \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

      - name: Wait for public LoadBalancer DNS
        run: |
          for i in {1..36}; do
            HOST=$(kubectl get svc java-cicd-app \
              -n "$K8S_NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$HOST" ]; then
              echo "Application URL: http://$HOST"
              exit 0
            fi

            echo "Waiting for AWS LoadBalancer hostname ($i/36)..."
            sleep 10
          done

          kubectl describe svc java-cicd-app -n "$K8S_NAMESPACE"

          echo "LoadBalancer hostname was not assigned within 6 minutes."
          exit 1
