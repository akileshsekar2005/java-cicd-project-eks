apiVersion: v1
kind: Service
metadata:
  name: java-cicd-app
  namespace: java-cicd
  annotations:
    # Public-facing Network Load Balancer managed by EKS Auto Mode
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app: java-cicd-app
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
